<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ClubSodaX 的个人学术主页。个人介绍、研究方向与学术论文。">
  <meta name="theme-color" content="#ffffff">
  <title>ClubSodaX · 个人学术主页</title>
  <link rel="icon" href="assets/favicon.svg?v=20261023-3" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css?v=20261023-3">
  <script src="assets/site-data.js?v=20261023-3" defer></script>
  <script src="assets/main.js?v=20261023-3" defer></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">跳转到正文</a>
  <header class="site-header" id="home">
    <div class="shell header-inner">
      <a class="wordmark" href="#home" aria-label="ClubSodaX home"><span class="brand-mark" aria-hidden="true">C</span>ClubSodaX</a>
      <nav class="desktop-nav" aria-label="主导航" data-nav>
        <a href="#about" data-i18n="navAbout">关于</a>
        <a href="#publications" data-i18n="navPublications">论文</a>
        <a href="#contact" data-i18n="navContact">联系</a>
      </nav>
      <button class="language-toggle" type="button" aria-label="Switch to English" data-language>English</button>
    </div>
  </header>
  <main class="shell page-layout" id="main">
    <aside class="profile-sidebar hero" aria-labelledby="profile-name">
      <div class="portrait-card" aria-label="个人照片占位" data-portrait>
        <div class="portrait-placeholder">
          <svg class="portrait-icon" viewBox="0 0 64 64" fill="none" aria-hidden="true"><circle cx="32" cy="23" r="10"/><path d="M13 55v-5a19 19 0 0 1 38 0v5"/></svg>
          <span class="portrait-label" data-i18n="photoCaption">个人照片</span>
        </div>
      </div>
      <div class="hero-copy">
        <p class="profile-status" data-profile-status data-i18n="profilePending">个人资料待完善</p>
        <h1 id="profile-name">你的姓名<span class="name-cn">Your Name</span></h1>
        <p class="hero-affiliation" data-profile="affiliation">学校 / 研究机构 · 院系 / 实验室</p>
        <div class="hero-links">
          <a class="text-link" href="https://github.com/ClubSodaX" data-github target="_blank" rel="noopener noreferrer">GitHub</a>
          <a class="text-link" data-cv hidden target="_blank" rel="noopener noreferrer" data-i18n="cv">简历</a>
        </div>
      </div>
    </aside>
    <div class="main-content">
    <section class="content-section" id="about" aria-labelledby="about-title">
      <div class="section-heading"><h2 id="about-title" data-i18n="aboutTitle">关于我</h2></div>
      <div class="section-body about-layout">
        <p class="intro" data-profile="intro">个人简介待补充。</p>
        <div class="prose" data-about><p>教育背景、研究经历与目前的工作。</p></div>
      </div>
    </section>
    <section class="content-section" id="research" aria-labelledby="research-title">
      <div class="section-heading"><h2 id="research-title" data-i18n="researchTitle">研究兴趣</h2></div>
      <div class="section-body research-list" data-research></div>
    </section>
    <section class="content-section" id="publications" aria-labelledby="publications-title">
      <div class="section-heading"><h2 id="publications-title" data-i18n="publicationsTitle">学术论文</h2><span class="section-note" data-placeholder-note="publications" data-i18n="contentPending">内容待补充</span></div>
      <div class="section-body publication-list" data-publications></div>
    </section>
    <section class="content-section" id="contact" aria-labelledby="contact-title">
      <div class="section-heading"><h2 id="contact-title" data-i18n="contactTitle">联系方式</h2></div>
      <div class="section-body contact-layout"><p class="contact-intro" data-i18n="contactIntro">学术交流与项目合作</p><div class="contact-links" data-contact></div></div>
    </section>
    <noscript><p class="noscript-note">请启用 JavaScript 以显示研究和论文内容。You can find me on <a href="https://github.com/ClubSodaX">GitHub</a>.</p></noscript>
    </div>
  </main>
  <footer class="site-footer"><div class="shell footer-inner"><p>© <span data-year>2026</span> <span data-footer-name>ClubSodaX</span><span class="footer-separator"> / </span><span data-i18n="footer">个人学术主页</span></p><a href="#home" class="text-link"><span data-i18n="backTop">返回顶部</span> ↑</a></div></footer>
</body>
</html>
